<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Gorilla Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172731;color:#f4edda;font:14px system-ui,sans-serif}header{padding:15px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #49606e}h1{font-size:24px;margin:0 auto 0 0}button,a,input,select{font:inherit;color:inherit}button,a,.file{padding:7px 10px;background:#29434f;border:1px solid #547381;border-radius:5px;cursor:pointer;text-decoration:none}button.primary{background:#f3d399;color:#22303a;font-weight:700}main{display:grid;grid-template-columns:minmax(280px,1.2fr) minmax(280px,1fr) minmax(235px,280px);gap:12px;padding:12px;align-items:start}.panel{background:#223540;border:1px solid #405a66;border-radius:7px;padding:10px}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}.bar strong{margin-right:auto}canvas{display:block;width:100%;height:clamp(260px,53vh,570px);touch-action:none}#plan{height:auto;aspect-ratio:480/530}label{display:flex;flex-direction:column;gap:3px;color:#c6dadf}input,select{background:#142630;border:1px solid #4c6671;border-radius:4px;padding:5px;min-width:0;width:100%}input[type=checkbox]{width:auto}input[type=color]{min-height:32px}input[type=file]{display:none}#pieces{height:6em}#labels,.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}.wide{grid-column:1/-1}summary{cursor:pointer;margin:8px 0}p{line-height:1.45;color:#c6dadf}h2{font-size:15px;margin:.4rem 0}@media(max-width:1000px){main{grid-template-columns:1fr 1fr}aside{grid-column:1/-1}}@media(max-width:630px){main{display:block}.panel{margin-bottom:10px}}
</style></head><body>
<header><h1>Atelier Gorilla Lab</h1><a href="./">Jouer</a><button id="new-example">Exemple</button><button id="blank-map">Map vide</button><label class="file">Importer JSON<input id="import-map" type="file" accept=".json,application/json"></label><button id="export-map">Exporter JSON</button><button id="test-map" class="primary">Jouer cette map</button></header>
<main>
<section class="panel"><div class="bar"><strong>Plan au sol</strong><label>Grille<select id="snap"><option>.25</option><option>.5</option><option>1</option></select></label><button id="zoom-fit">Cadrer</button></div><canvas id="plan" width="480" height="530" aria-label="Plan de la carte"></canvas><p>Glisse une pièce pour la déplacer. Le point doré indique le départ.</p></section>
<section class="panel"><div class="bar"><strong>Aperçu 3D</strong><span id="count"></span></div><canvas id="preview" aria-label="Aperçu 3D"></canvas><p>Glisser pour tourner, molette pour zoomer.</p><p id="editor-note" role="status"></p></section>
<aside class="panel"><label>Nom de la map<input id="map-name" maxlength="56"></label>
<div class="bar"><button id="add-block">Bloc</button><button id="add-ramp">Rampe</button><button id="add-wall">Mur</button><button id="duplicate">Dupliquer</button><button id="delete">Supprimer</button><button id="undo">Annuler</button></div>
<label>Pièces<select id="pieces" size="5"></select></label>
<h2>Pièce sélectionnée</h2><div class="fields">
<label class="wide">Nom<input id="p-name" maxlength="36"></label>
<label>X (m)<input id="p-x" type="number" step=".25"></label><label>Z (m)<input id="p-z" type="number" step=".25"></label><label>Hauteur du centre<input id="p-y" type="number" step=".25"></label><label>Rotation (°)<input id="p-yaw" type="number" step="1"></label><label>Largeur<input id="p-w" type="number" step=".25"></label><label>Profondeur<input id="p-d" type="number" step=".25"></label><label>Épaisseur<input id="p-h" type="number" step=".25"></label><label>Pente (°)<input id="p-pitch" type="number" step="1"></label>
<label>Matériau<select id="p-material"></select></label><label>Teinte<input id="p-color" type="color"></label><label class="file">Image de texture<input id="texture-file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="texture-clear">Retirer l’image</button>
<label class="wide">Surface<select id="surface"><option value="">Préréglage…</option><option value="normal">Normale</option><option value="ice">Glace</option><option value="rubber">Caoutchouc</option><option value="moon">Faible gravité</option></select></label>
<label>Grip<input id="p-grip" type="number" step=".05"></label><label>Gravité<input id="p-gravity" type="number" step=".05"></label><label>Rebond<input id="p-bounce" type="number" step=".05"></label><label>Solide<input id="p-solid" type="checkbox"></label>
</div><details><summary>Point de départ</summary><div class="fields"><label>X<input id="spawn-x" type="number" step=".25"></label><label>Y<input id="spawn-y" type="number" step=".25"></label><label>Z<input id="spawn-z" type="number" step=".25"></label><label>Direction (°)<input id="spawn-yaw" type="number" step=".25"></label><button class="wide" id="spawn-here">Au-dessus de la pièce</button></div></details>
</aside></main><script defer src="./gorilla-editor-r17.js"></script></body></html>
