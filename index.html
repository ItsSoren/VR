<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALLON VR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#839f9d;color:#f9efd8;font:14px system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
aside{position:fixed;top:1rem;left:1rem;width:min(355px,calc(100vw - 2rem));max-height:calc(100vh - 2rem);overflow:auto;padding:1rem 1.25rem;background:#202f26ed;border:1px solid #968867;border-radius:5px;box-shadow:0 12px 40px #18271938}
h1{margin:0;font:700 2.2rem Georgia;letter-spacing:.08em}h2{font:1.12rem Georgia;margin:.15rem 0 1rem;color:#e5c888}
p{margin:.5rem 0;line-height:1.4}button,select,input,summary{font:inherit}button,select{background:#e0c58d;color:#292f25;border:0;border-radius:3px;padding:.55rem .72rem}button{cursor:pointer}button:disabled{opacity:.55}summary{cursor:pointer;padding:.5rem 0;color:#e6ca90}details{border-top:1px solid #6e755d;margin-top:.55rem}label{display:flex;justify-content:space-between;align-items:center;margin:.35rem 0;gap:.6rem}output{min-width:3.4em;text-align:right}.recipes button{display:block;margin:.35rem 0}.immersive aside{display:none}
#inventory{color:#e2d7a9;font-size:.85rem}#feedback{min-height:1.2em;color:#eed297}
body:not(.immersive)::after{content:"";position:fixed;top:50%;left:50%;width:6px;height:6px;background:#fff3ce;border:1px solid #324535;border-radius:50%;pointer-events:none}</style>
<canvas aria-label="Paysage de Vallon"></canvas>
<aside>
<h1>VALLON VR</h1><h2>Les terres tranquilles</h2>
<button id="start">Démarrer sur PC</button>
<button id="vr" disabled>Entrer en VR</button>
<p id="info">Sur PC : ZQSD ou flèches. Glisse pour regarder. 1–7 : objet. E : utiliser. F : remblayer.</p>
<p id="score" aria-live="polite">0 / 3 balises</p>
<p id="inventory"></p><p id="feedback" aria-live="polite"></p>
<details class="recipes"><summary>Atelier</summary>
<button data-recipe="0">1 bûche → 4 bois</button>
<button data-recipe="1">2 terre + 1 pierre → 2 verre</button>
<button data-recipe="2">1 bûche + 1 pierre → 3 torches</button>
</details>
<details><summary>Réglages visuels</summary>
<label>Visibilité <input id="distance" type="range" min="100" max="500" step="25" value="300" oninput="this.nextElementSibling.value=this.value+' m'"><output>300 m</output></label>
<label>Qualité <select id="quality"><option value="high">Équilibrée</option><option value="low">Légère</option></select></label>
<label>Filtre pixel <select id="pixel"><option value="1">Désactivé</option><option value="2">×2</option><option value="4">×4</option></select></label>
</details>
</aside>
<script src="./game.js"></script>
</html>
