name: Build Gorilla Lab bundles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(build):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build versioned bundles
        run: npm run build
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-lab-r*.js gorilla-editor-r*.js gorilla-model-editor-r*.js index.html editor.html model-editor.html floor-plan.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(build): generate Gorilla Lab bundles"
          git push origin HEAD:main
