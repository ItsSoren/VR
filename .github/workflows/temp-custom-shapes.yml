name: Temporary custom shape studio verification
on:
  push:
    branches: [feature/foundry-custom-shapes-r42]
    paths:
      - '.github/workflows/temp-custom-shapes.yml'
      - 'scripts/temp-custom-shape-smoke.mjs'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock puppeteer-core
      - run: node scripts/temp-custom-shape-smoke.mjs
      - name: Commit static studio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-editor.html gorilla-model-editor-r26.js game-lab-r37.js gorilla-editor-r37.js editor.html
          if ! git diff --cached --quiet; then
            git commit -m "Build custom-form modeling workshop"
            git push
          fi
