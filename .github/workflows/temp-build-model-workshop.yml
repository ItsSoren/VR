name: Temporary workshop build
on:
  push:
    branches: [feature/modeles-dans-cartes-r37]
    paths:
      - '.github/workflows/temp-build-model-workshop.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - name: Commit generated playground bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editor.html model-editor.html game-lab-r37.js gorilla-editor-r37.js gorilla-model-editor-r26.js
          if ! git diff --cached --quiet; then
            git commit -m "Build updated 3D workshop editors"
            git push
          fi
