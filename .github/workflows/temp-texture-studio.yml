name: Temporary Surface Lab validation
on:
  push:
    branches: [feature/texture-studio-shared-r41]
    paths:
      - '.github/workflows/temp-texture-studio.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock puppeteer-core
      - run: node scripts/temp-shared-texture-browser.mjs
      - run: echo 'Shared Surface Lab GLB export verified'
      - name: Commit generated site bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editor.html model-editor.html game-lab-r37.js gorilla-editor-r37.js gorilla-model-editor-r26.js
          if ! git diff --cached --quiet; then
            git commit -m "Build shared Surface Lab texture editor"
            git push
          fi
