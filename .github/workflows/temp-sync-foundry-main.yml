name: Temporary sync with transform fix
on:
  push:
    branches: [feature/foundry-custom-shapes-r42]
    paths:
      - '.github/workflows/temp-sync-foundry-main.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge the latest gizmo fix from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          files=$(git diff --name-only --diff-filter=U)
          for file in $files; do
            case "$file" in
              gorilla-model-editor-r26.js|gorilla-editor-r37.js|game-lab-r37.js|model-editor.html|editor.html)
                git checkout --theirs -- "$file"
                git add "$file"
                ;;
              *)
                echo "Unexpected source conflict: $file"
                exit 1
                ;;
            esac
          done
          test -z "$(git diff --name-only --diff-filter=U)"
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock puppeteer-core
      - run: node scripts/temp-custom-shape-smoke.mjs
      - name: Commit merged source and rebuilt bundles
        run: |
          git add gorilla-model-editor-r26.js gorilla-editor-r37.js game-lab-r37.js model-editor.html editor.html
          git commit -m "Merge model transform fix and rebuild custom shape Foundry"
          git push
