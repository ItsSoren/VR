name: Temporary map editor UX regression
on:
  push:
    branches: [fix/map-editor-model-library-context-stable-help-r45]
    paths:
      - '.github/workflows/temp-map-ux-r45.yml'
      - 'scripts/temp-map-ux-browser-r45.mjs'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock puppeteer-core
      - run: node scripts/temp-map-ux-browser-r45.mjs
      - name: Commit built editor assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gorilla-editor-r37.js gorilla-model-editor-r26.js editor.html model-editor.html
          if ! git diff --cached --quiet; then
            git commit -m "Build improved map editor model management"
            git push
          fi
