name: Temporary selectable props regression
on:
  push:
    branches: [fix/map-editor-selectable-grabbable-models-r46]
    paths:
      - '.github/workflows/temp-selectable-props-r46.yml'
      - 'scripts/temp-selectable-props-browser-r46.mjs'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock puppeteer-core
      - run: node scripts/temp-selectable-props-browser-r46.mjs
      - name: Commit built editor assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gorilla-editor-r37.js editor.html
          if ! git diff --cached --quiet; then
            git commit -m "Build selectable and editable grab props in map editor"
            git push
          fi
