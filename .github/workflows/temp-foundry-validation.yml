name: Temporary Foundry validation
on:
  push:
    branches: [feature/model-foundry-workspace-r40]
    paths:
      - '.github/workflows/temp-foundry-validation.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock puppeteer-core
      - run: node scripts/temp-foundry-browser.mjs
      - name: Commit published model workshop files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-editor.html gorilla-model-editor-r26.js
          if ! git diff --cached --quiet; then
            git commit -m "Build GORILLA Foundry model workshop"
            git push
          fi
