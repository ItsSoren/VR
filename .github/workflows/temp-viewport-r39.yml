name: Temporary map workshop viewport validation
on:
  push:
    branches: [feature/atelier-cartes-interface-viewport-r39]
    paths:
      - '.github/workflows/temp-viewport-r39.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock puppeteer-core
      - run: node scripts/temp-viewport-smoke.mjs
      - name: Commit generated site bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editor.html model-editor.html game-lab-r37.js gorilla-editor-r37.js gorilla-model-editor-r26.js
          if ! git diff --cached --quiet; then
            git commit -m "Build viewport-first map workshop"
            git push
          fi
